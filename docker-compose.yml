services:
  postgres:
    image: postgres:17-alpine
    container_name: ikiforma-postgres
    environment:
      POSTGRES_DB: ikiforma
      POSTGRES_USER: ikiforma
      POSTGRES_PASSWORD: ikiforma
    ports:
      - "5433:5432"
    volumes:
      - ikiforma-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ikiforma -d ikiforma"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ikiforma-postgres-data:
